---
openapi: 3.0.3
info:
  title: ShopKeep API
  version: v1
  description: Mutating requests send the token from GET /api/v1/csrf in the X-CSRF-Token
    header and include the session cookie.
servers:
- url: http://127.0.0.1:3000
components:
  schemas:
    User:
      type: object
      required:
      - id
      - email
      - name
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
    Store:
      type: object
      required:
      - id
      - merchant_id
      - name
      - handle
      - currency
      - status
      - role
      properties:
        id:
          type: integer
        merchant_id:
          type: integer
        name:
          type: string
        handle:
          type: string
        currency:
          type: string
        status:
          type: string
        role:
          type: string
    Membership:
      type: object
      required:
      - id
      - user_id
      - email
      - name
      - role
      properties:
        id:
          type: integer
        user_id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
    AuditEvent:
      type: object
      required:
      - id
      - action
      - metadata
      - created_at
      properties:
        id:
          type: integer
        action:
          type: string
        actor_id:
          type: integer
          nullable: true
        subject_type:
          type: string
          nullable: true
        subject_id:
          type: integer
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        ip_address:
          type: string
          nullable: true
        created_at:
          type: string
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - details
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
paths:
  "/api/v1/stores/{store_id}/products":
    get:
      summary: List products
      tags:
      - Catalog
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: products
          content:
            application/json:
              schema:
                type: object
    post:
      summary: Create a product and its first variant
      tags:
      - Catalog
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
  "/api/v1/stores/{store_id}/products/{id}":
    get:
      summary: Show a product
      tags:
      - Catalog
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: product
          content:
            application/json:
              schema:
                type: object
    patch:
      summary: Update a product
      tags:
      - Catalog
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
  "/api/v1/stores/{store_id}/products/{id}/archive":
    post:
      summary: Archive a product
      tags:
      - Catalog
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: archived
          content:
            application/json:
              schema:
                type: object
  "/api/v1/stores/{store_id}/products/{product_id}/variants":
    post:
      summary: Add a variant
      tags:
      - Catalog
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      - name: product_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
  "/api/v1/stores/{store_id}/products/{product_id}/variants/{id}":
    patch:
      summary: Update a variant
      tags:
      - Catalog
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      - name: product_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
  "/api/v1/stores/{store_id}/products/{product_id}/images":
    post:
      summary: Upload a product image
      tags:
      - Catalog
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      - name: product_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: stored
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: file
        required: true
  "/api/v1/stores/{store_id}/products/{product_id}/images/{id}":
    get:
      summary: Download a product image
      tags:
      - Catalog
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      - name: product_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: file
  "/api/v1/stores/{store_id}/collections":
    get:
      summary: List collections
      tags:
      - Catalog
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: collections
          content:
            application/json:
              schema:
                type: object
    post:
      summary: Create a collection
      tags:
      - Catalog
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
  "/api/v1/stores/{store_id}/collections/{id}/products":
    post:
      summary: Add a product to a collection
      tags:
      - Catalog
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: added
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
  "/api/v1/stores/{store_id}/inventory_items":
    get:
      summary: List inventory
      tags:
      - Inventory
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: items
          content:
            application/json:
              schema:
                type: object
  "/api/v1/stores/{store_id}/inventory_items/{id}/adjustments":
    post:
      summary: Adjust on-hand inventory
      tags:
