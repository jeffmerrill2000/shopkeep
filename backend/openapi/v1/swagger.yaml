          type: integer
        required: true
      responses:
        '200':
          description: adjusted
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
  "/api/v1/stores/{store_id}/discount_codes":
    get:
      summary: List discount codes
      tags:
      - Pricing
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: codes
          content:
            application/json:
              schema:
                type: object
    post:
      summary: Create a discount code
      tags:
      - Pricing
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
  "/api/v1/stores/{store_id}/shipping_rates":
    get:
      summary: List shipping rates
      tags:
      - Pricing
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: rates
          content:
            application/json:
              schema:
                type: object
    post:
      summary: Create a shipping rate
      tags:
      - Pricing
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
  "/api/v1/stores/{store_id}/tax_rates":
    get:
      summary: List tax rates
      tags:
      - Pricing
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: rates
          content:
            application/json:
              schema:
                type: object
    post:
      summary: Create a tax rate
      tags:
      - Pricing
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
  "/api/v1/stores/{store_id}/orders":
    get:
      summary: List orders
      tags:
      - Orders
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: orders
          content:
            application/json:
              schema:
                type: object
  "/api/v1/stores/{store_id}/orders/{id}":
    get:
      summary: Show an order
      tags:
      - Orders
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: order
          content:
            application/json:
              schema:
                type: object
  "/api/v1/stores/{store_id}/orders/{id}/fulfillment":
    post:
      summary: Advance fulfillment
      tags:
      - Orders
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
  "/api/v1/stores/{store_id}/customers":
    get:
      summary: List customers
      tags:
      - Customers
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: customers
          content:
            application/json:
              schema:
                type: object
  "/api/v1/stores/{store_id}/customers/{id}":
    get:
      summary: Show a customer
      tags:
      - Customers
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: customer
          content:
            application/json:
              schema:
                type: object
  "/api/v1/stores/{store_id}/sales_summary":
    get:
      summary: Sales summary
      tags:
      - Reports
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: summary
          content:
            application/json:
              schema:
                type: object
  "/api/v1/storefront/{handle}":
    get:
      summary: Public storefront
      tags:
      - Storefront
      parameters:
      - name: handle
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: catalog
          content:
            application/json:
              schema:
                type: object
  "/api/v1/storefront/{handle}/products":
    get:
      summary: Public products
      tags:
      - Storefront
      parameters:
      - name: handle
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: products
          content:
            application/json:
              schema:
                type: object
  "/api/v1/storefront/{handle}/products/{product_handle}":
    get:
      summary: Public product
      tags:
      - Storefront
      parameters:
      - name: handle
        in: path
        schema:
          type: string
        required: true
      - name: product_handle
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: product
          content:
            application/json:
              schema:
                type: object
  "/api/v1/storefront/{handle}/images/{id}":
    get:
      summary: Public product image
      tags:
      - Storefront
      parameters:
      - name: handle
        in: path
        schema:
          type: string
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: file
  "/api/v1/storefront/{handle}/cart":
    get:
      summary: Public cart
      tags:
      - Storefront
      parameters:
      - name: handle
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: cart
          content:
            application/json:
              schema:
                type: object
  "/api/v1/storefront/{handle}/cart/lines":
    post:
      summary: Add a cart line
      tags:
      - Storefront
      parameters:
      - name: handle
        in: path
        schema:
          type: string
        required: true
      responses:
        '201':
          description: added
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
  "/api/v1/storefront/{handle}/cart/lines/{id}":
    patch:
      summary: Update a cart line
      tags:
      - Storefront
      parameters:
      - name: handle
        in: path
        schema:
          type: string
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
    delete:
      summary: Remove a cart line
      tags:
      - Storefront
      parameters:
      - name: handle
        in: path
        schema:
          type: string
        required: true
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: removed
          content:
            application/json:
              schema:
                type: object
  "/api/v1/storefront/{handle}/checkout":
    post:
      summary: Check out the current cart
      tags:
      - Storefront
      parameters:
      - name: handle
        in: path
        schema:
          type: string
        required: true
      - name: Idempotency-Key
        in: header
        schema:
          type: string
        required: true
      responses:
        '201':
          description: order placed
          content:
            application/json:
              schema:
                type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
  "/api/v1/storefront/{handle}/orders/{number}":
    get:
      summary: Public order confirmation
      tags:
      - Storefront
      parameters:
      - name: handle
        in: path
        schema:
          type: string
        required: true
      - name: number
        in: path
        schema:
          type: string
        required: true
      - name: access_token
        in: query
        schema:
          type: string
        required: true
      responses:
        '200':
          description: order
          content:
            application/json:
              schema:
                type: object
  "/api/v1/health":
    get:
      summary: Service health
      tags:
      - Operations
      responses:
        '200':
          description: dependencies are reachable
  "/api/v1/csrf":
    get:
      summary: CSRF token
      tags:
      - Identity
      responses:
        '200':
          description: token for the session cookie
          content:
            application/json:
              schema:
                type: object
                required:
                - csrf_token
                properties:
                  csrf_token:
                    type: string
  "/api/v1/registration":
    post:
      summary: Register an owner, merchant, and store
      tags:
      - Identity
      parameters: []
      responses:
        '201':
          description: registered
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                - store
                properties:
                  user:
                    "$ref": "#/components/schemas/User"
                  store:
                    "$ref": "#/components/schemas/Store"
        '422':
          description: invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              - name
              - store_name
              - handle
              properties:
                email:
                  type: string
                password:
                  type: string
                name:
                  type: string
                store_name:
                  type: string
                handle:
                  type: string
                currency:
                  type: string
        required: true
  "/api/v1/session":
    post:
      summary: Sign in
      tags:
      - Identity
      parameters: []
      responses:
        '200':
          description: signed in
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                - stores
                properties:
                  user:
                    "$ref": "#/components/schemas/User"
                  stores:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Store"
        '401':
          description: unknown credentials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                password:
                  type: string
        required: true
    delete:
      summary: Sign out
      tags:
      - Identity
      responses:
        '204':
          description: signed out
        '401':
          description: signed out already
  "/api/v1/me":
    get:
      summary: Current user and stores
      tags:
      - Identity
      responses:
        '200':
          description: current session
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                - stores
                properties:
                  user:
                    "$ref": "#/components/schemas/User"
                  stores:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Store"
        '401':
          description: no session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/stores":
    get:
      summary: List the signed-in user's stores
      tags:
      - Stores
      responses:
        '200':
          description: membership stores
          content:
            application/json:
              schema:
                type: object
                properties:
                  stores:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Store"
    post:
      summary: Create a store on an owned merchant
      tags:
      - Stores
      parameters: []
      responses:
        '201':
          description: store created
          content:
            application/json:
              schema:
                type: object
                properties:
                  store:
                    "$ref": "#/components/schemas/Store"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - merchant_id
              - name
              - handle
              properties:
                merchant_id:
                  type: integer
                name:
                  type: string
                handle:
                  type: string
                currency:
                  type: string
        required: true
  "/api/v1/stores/{id}":
    get:
      summary: Show a store the user belongs to
      tags:
      - Stores
      parameters:
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: store
          content:
            application/json:
              schema:
                type: object
                properties:
                  store:
                    "$ref": "#/components/schemas/Store"
        '404':
          description: not a member
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Update store settings
      tags:
      - Stores
      parameters:
      - name: id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  store:
                    "$ref": "#/components/schemas/Store"
        '403':
          description: staff cannot update
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                currency:
                  type: string
  "/api/v1/stores/{store_id}/memberships":
    get:
      summary: List memberships
      tags:
      - Memberships
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '200':
          description: members
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberships:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Membership"
    post:
      summary: Add an admin or staff member
      tags:
      - Memberships
      parameters:
      - name: store_id
        in: path
        schema:
          type: integer
        required: true
      responses:
        '201':
          description: membership created
          content:
            application/json:
              schema:
                type: object
                properties:
                  membership:
                    "$ref": "#/components/schemas/Membership"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - role
              properties:
